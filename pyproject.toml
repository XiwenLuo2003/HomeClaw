[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homeclaw"
version = "0.2.0"
description = "Production-oriented smart-home agent orchestration and execution runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = [
  "openai>=1.0,<3",
  "anthropic>=0.25,<2"
]
production = [
  "mcp>=1.12,<2",
  "paho-mqtt>=2.1,<3",
  "redis>=5,<8",
  "psycopg[binary]>=3.2,<4",
  "pymongo>=4.8,<5",
  "aio-pika>=9.5,<10",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29,<2"
]
semantic-memory = ["sentence-transformers>=2.7,<6"]

[tool.setuptools.packages.find]
include = ["homeclaw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
