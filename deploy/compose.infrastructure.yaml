services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: homeclaw
      POSTGRES_USER: homeclaw
      POSTGRES_PASSWORD: ${HOMECLAW_POSTGRES_PASSWORD:?set HOMECLAW_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeclaw -d homeclaw"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${HOMECLAW_REDIS_PASSWORD:?set HOMECLAW_REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${HOMECLAW_REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: homeclaw
      MONGO_INITDB_ROOT_PASSWORD: ${HOMECLAW_MONGO_PASSWORD:?set HOMECLAW_MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongodb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: homeclaw
      RABBITMQ_DEFAULT_PASS: ${HOMECLAW_RABBITMQ_PASSWORD:?set HOMECLAW_RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - mqtt-data:/mosquitto/data
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  rabbitmq-data:
  mqtt-data:
